<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder | MailMind</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/resume.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <a href="/" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
    </a>

    <div class="card">

        <h1>📄 AI Resume Builder</h1>

        <p>Create a professional resume in seconds using AI.</p>

        <form id="resumeForm">

            <label>👤 Full Name</label>
            <input type="text" id="name" required>

            <label>📧 Email</label>
            <input type="email" id="email" required>

            <label>📱 Phone</label>
            <input type="text" id="phone" required>

            <label>🎯 Career Objective</label>
            <textarea id="objective"></textarea>

            <label>🎓 Education</label>
            <textarea id="education" required></textarea>

            <label>💼 Experience</label>
            <textarea id="experience"></textarea>

            <label>🛠 Skills</label>
            <textarea id="skills" required></textarea>

            <label>🚀 Projects</label>
            <textarea id="projects"></textarea>

            <label>🏆 Certifications</label>
            <textarea id="certifications"></textarea>

            <button type="submit" class="generate-btn">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                Generate Resume
            </button>

        </form>

    </div>

    <div class="output" id="outputSection">

        <h2>Generated Resume</h2>

        <div class="resume-box" id="generatedResume">

            Your AI-generated resume will appear here...

        </div>

        <div class="actions">

    <button type="button" id="copyBtn">
        <i class="fa-solid fa-copy"></i>
        Copy
    </button>

    <button type="button" id="regenBtn">
        <i class="fa-solid fa-rotate-right"></i>
        Regenerate
    </button>

    <button type="button" id="downloadBtn">
        <i class="fa-solid fa-download"></i>
        Download
    </button>

</div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/resume.js') }}"></script>

</body>
</html>
